{% extends "base.html" %}

{% block title %}Edit Patient · MediTrack{% endblock %}

{% block content %}
<div class="page-container">
  <div class="page-header">
    <h1><i class="fas fa-user-edit"></i> Edit Patient</h1>
    <a href="/patients" class="btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
  </div>

  {% if error %}
  <div class="alert">
    <i class="fas fa-exclamation-circle"></i> {{ error }}
  </div>
  {% endif %}

  <div class="form-container">
    <form action="/patients/edit/{{ patient.id }}" method="POST">
      <div class="form-grid">
        <div class="form-group">
          <label>Patient Code</label>
          <input type="text" value="{{ patient.patient_code }}" disabled />
          <small>Patient code cannot be changed</small>
        </div>
        <div class="form-group">
          <label>Full Name <span class="required">*</span></label>
          <input type="text" name="name" value="{{ patient.name }}" required />
        </div>
        <div class="form-group">
          <label>Age <span class="required">*</span></label>
          <input type="number" name="age" value="{{ patient.age }}" min="0" max="150" required />
        </div>
        <div class="form-group">
          <label>Gender <span class="required">*</span></label>
          <select name="gender" required>
            <option value="Male" {% if patient.gender == 'Male' %}selected{% endif %}>Male</option>
            <option value="Female" {% if patient.gender == 'Female' %}selected{% endif %}>Female</option>
            <option value="Other" {% if patient.gender == 'Other' %}selected{% endif %}>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Disease <span class="required">*</span></label>
          <input type="text" name="disease" value="{{ patient.disease }}" required />
        </div>
        <div class="form-group">
          <label>Doctor <span class="required">*</span></label>
          <select name="doctor_id" required>
            <option value="">Select Doctor</option>
            {% for doctor in doctors %}
            <option value="{{ doctor.id }}" {% if doctor.id == patient.doctor_id %}selected{% endif %}>
              {{ doctor.name }} ({{ doctor.specialization }})
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Phone <span class="required">*</span></label>
          <input type="text" name="phone" value="{{ patient.phone }}" required />
        </div>
        <div class="form-group">
          <label>Admission Date <span class="required">*</span></label>
          <input type="date" name="admission_date" value="{{ patient.admission_date.strftime('%Y-%m-%d') if patient.admission_date else '' }}" required />
        </div>
        <div class="form-group">
          <label>Discharge Date</label>
          <input type="date" name="discharge_date" value="{{ patient.discharge_date.strftime('%Y-%m-%d') if patient.discharge_date else '' }}" />
          <small>Leave empty if patient is still admitted</small>
        </div>
        <div class="form-group full-width">
          <label>Address</label>
          <textarea name="address" rows="3">{{ patient.address or '' }}</textarea>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Update Patient</button>
        <a href="/patients" class="btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
