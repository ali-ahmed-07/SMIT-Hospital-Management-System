{% extends "base.html" %}

{% block title %}Edit Appointment · MediTrack{% endblock %}

{% block content %}
<div class="page-container">
  <div class="page-header">
    <h1><i class="fas fa-calendar-check"></i> Edit Appointment</h1>
    <a href="/appointments" class="btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
  </div>

  {% if error %}
  <div class="alert alert-error">
    <i class="fas fa-exclamation-circle"></i> {{ error }}
  </div>
  {% endif %}

  <div class="form-container">
    <form action="/appointments/edit/{{ appointment.id }}" method="POST">
      <div class="form-grid">
        <div class="form-group">
          <label>Appointment Code</label>
          <input type="text" value="{{ appointment.appointment_code }}" disabled />
          <small>Code cannot be changed</small>
        </div>

        <div class="form-group">
          <label>Patient <span class="required">*</span></label>
          <select name="patient_id" required>
            <option value="">Select Patient</option>
            {% for patient in patients %}
            <option value="{{ patient.id }}" {% if patient.id == appointment.patient_id %}selected{% endif %}>
              {{ patient.name }} ({{ patient.patient_code }})
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label>Doctor <span class="required">*</span></label>
          <select name="doctor_id" required>
            <option value="">Select Doctor</option>
            {% for doctor in doctors %}
            <option value="{{ doctor.id }}" {% if doctor.id == appointment.doctor_id %}selected{% endif %}>
              Dr. {{ doctor.name }} ({{ doctor.specialization }})
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label>Staff</label>
          <select name="staff_id">
            <option value="">Select Staff (Optional)</option>
            {% for staff_member in staff_members %}
            <option value="{{ staff_member.id }}" {% if staff_member.id == appointment.staff_id %}selected{% endif %}>
              {{ staff_member.name }}
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label>Appointment Date <span class="required">*</span></label>
          <input type="date" name="appointment_date" value="{{ appointment.appointment_date.strftime('%Y-%m-%d') if appointment.appointment_date else '' }}" required />
        </div>

        <div class="form-group">
          <label>Appointment Time <span class="required">*</span></label>
          <input type="time" name="appointment_time" value="{{ appointment.appointment_time.strftime('%H:%M') if appointment.appointment_time else '' }}" required />
        </div>

        <div class="form-group full-width">
          <label>Reason for Visit <span class="required">*</span></label>
          <textarea name="reason" rows="2" required>{{ appointment.reason }}</textarea>
        </div>

        <div class="form-group full-width">
          <label>Symptoms</label>
          <textarea name="symptoms" rows="2">{{ appointment.symptoms or '' }}</textarea>
        </div>

        <div class="form-group full-width">
          <label>Notes</label>
          <textarea name="notes" rows="2">{{ appointment.notes or '' }}</textarea>
        </div>

        <div class="form-group">
          <label>Status <span class="required">*</span></label>
          <select name="status" required>
            <option value="scheduled" {% if appointment.status == 'scheduled' %}selected{% endif %}>Scheduled</option>
            <option value="confirmed" {% if appointment.status == 'confirmed' %}selected{% endif %}>Confirmed</option>
            <option value="in-progress" {% if appointment.status == 'in-progress' %}selected{% endif %}>In Progress</option>
            <option value="completed" {% if appointment.status == 'completed' %}selected{% endif %}>Completed</option>
            <option value="cancelled" {% if appointment.status == 'cancelled' %}selected{% endif %}>Cancelled</option>
            <option value="no-show" {% if appointment.status == 'no-show' %}selected{% endif %}>No-Show</option>
          </select>
        </div>

        <div class="form-group">
          <label>Follow-up Date</label>
          <input type="date" name="follow_up_date" value="{{ appointment.follow_up_date.strftime('%Y-%m-%d') if appointment.follow_up_date else '' }}" />
        </div>

        <div class="form-group full-width">
          <label>Follow-up Notes</label>
          <textarea name="follow_up_notes" rows="2">{{ appointment.follow_up_notes or '' }}</textarea>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Update Appointment</button>
        <a href="/appointments" class="btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
