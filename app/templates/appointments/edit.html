{% extends "base.html" %}

{% block title %}Edit Prescription · MediTrack{% endblock %}

{% block content %}
<div class="page-container">
  <div class="page-header">
    <h1><i class="fas fa-prescription"></i> Edit Prescription</h1>
    <a href="/prescriptions" class="btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
  </div>

  {% if error %}
  <div class="alert alert-error">
    <i class="fas fa-exclamation-circle"></i> {{ error }}
  </div>
  {% endif %}

  <div class="form-container">
    <form action="/prescriptions/edit/{{ prescription.id }}" method="POST">
      <div class="form-grid">
        <div class="form-group">
          <label>Prescription Code</label>
          <input type="text" value="{{ prescription.prescription_code }}" disabled />
          <small>Code cannot be changed</small>
        </div>

        <div class="form-group">
          <label>Patient <span class="required">*</span></label>
          <select name="patient_id" required>
            <option value="">Select Patient</option>
            {% for patient in patients %}
            <option value="{{ patient.id }}" {% if patient.id == prescription.patient_id %}selected{% endif %}>
              {{ patient.name }} ({{ patient.patient_code }})
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label>Doctor <span class="required">*</span></label>
          <select name="doctor_id" required>
            <option value="">Select Doctor</option>
            {% for doctor in doctors %}
            <option value="{{ doctor.id }}" {% if doctor.id == prescription.doctor_id %}selected{% endif %}>
              {{ doctor.name }} ({{ doctor.specialization }})
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label>Prescription Date <span class="required">*</span></label>
          <input type="date" name="prescription_date" value="{{ prescription.prescription_date.strftime('%Y-%m-%d') if prescription.prescription_date else '' }}" required />
        </div>

        <div class="form-group full-width">
          <label>Diagnosis <span class="required">*</span></label>
          <textarea name="diagnosis" rows="2" required>{{ prescription.diagnosis }}</textarea>
        </div>

        <div class="form-group full-width">
          <label>Medicines</label>
          <textarea name="medicines" rows="4">{{ prescription.medicines or '' }}</textarea>
        </div>

        <div class="form-group full-width">
          <label>Dosage Instructions</label>
          <textarea name="dosage_instructions" rows="2">{{ prescription.dosage_instructions or '' }}</textarea>
        </div>

        <div class="form-group">
          <label>Valid Until</label>
          <input type="date" name="valid_until" value="{{ prescription.valid_until.strftime('%Y-%m-%d') if prescription.valid_until else '' }}" />
        </div>

        <div class="form-group">
          <label>Follow-up Date</label>
          <input type="date" name="follow_up_date" value="{{ prescription.follow_up_date.strftime('%Y-%m-%d') if prescription.follow_up_date else '' }}" />
        </div>

        <div class="form-group">
          <label>Follow-up Notes</label>
          <input type="text" name="follow_up_notes" value="{{ prescription.follow_up_notes or '' }}" placeholder="Follow-up instructions..." />
        </div>

        <div class="form-group full-width">
          <label>Additional Notes</label>
          <textarea name="notes" rows="2">{{ prescription.notes or '' }}</textarea>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Update Prescription</button>
        <a href="/prescriptions" class="btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
