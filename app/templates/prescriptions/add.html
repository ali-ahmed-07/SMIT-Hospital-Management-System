{% extends "base.html" %}

{% block title %}New Prescription · MediTrack{% endblock %}

{% block content %}
<div class="page-container">
  <div class="page-header">
    <h1><i class="fas fa-prescription"></i> New Prescription</h1>
    <a href="/prescriptions" class="btn-secondary">
      <i class="fas fa-arrow-left"></i> Back
    </a>
  </div>

  {% if error %}
  <div class="alert alert-error">
    <i class="fas fa-exclamation-circle"></i> {{ error }}
  </div>
  {% endif %}

  <div class="form-container">
    <form action="/prescriptions/add" method="POST">
      <div class="form-grid">
        <div class="form-group">
          <label>Patient <span class="required">*</span></label>
          <select name="patient_id" required>
            <option value="">Select Patient</option>
            {% for patient in patients %}
            <option value="{{ patient.id }}" {% if selected_patient and selected_patient.id == patient.id %}selected{% endif %}>
              {{ patient.name }} ({{ patient.patient_code }})
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label>Doctor <span class="required">*</span></label>
          <select name="doctor_id" required>
            <option value="">Select Doctor</option>
            {% for doctor in doctors %}
            <option value="{{ doctor.id }}">
              {{ doctor.name }} ({{ doctor.specialization }})
            </option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group full-width">
          <label>Diagnosis <span class="required">*</span></label>
          <textarea name="diagnosis" rows="3" placeholder="Enter diagnosis details" required></textarea>
        </div>

        <div class="form-group full-width">
          <label>Medicines</label>
          <textarea name="medicines" rows="5" placeholder="Enter medicines details (one per line)&#10;e.g.,&#10;1. Amoxicillin 500mg - Twice daily - 7 days&#10;2. Paracetamol 650mg - Thrice daily - 5 days"></textarea>
        </div>

        <div class="form-group full-width">
          <label>Dosage Instructions</label>
          <textarea name="dosage_instructions" rows="3" placeholder="Detailed dosage instructions"></textarea>
        </div>

        <div class="form-group">
          <label>Prescription Date <span class="required">*</span></label>
          <input type="date" name="prescription_date" value="{{ today }}" required />
        </div>

        <div class="form-group">
          <label>Valid Until</label>
          <input type="date" name="valid_until" />
        </div>

        <div class="form-group">
          <label>Follow-up Date</label>
          <input type="date" name="follow_up_date" />
        </div>

        <div class="form-group">
          <label>Follow-up Notes</label>
          <input type="text" name="follow_up_notes" placeholder="Follow-up instructions..." />
        </div>

        <div class="form-group full-width">
          <label>Additional Notes</label>
          <textarea name="notes" rows="3" placeholder="Any additional notes..."></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary">
          <i class="fas fa-save"></i> Create Prescription
        </button>
        <a href="/prescriptions" class="btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
