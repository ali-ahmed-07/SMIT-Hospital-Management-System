{% extends "base.html" %}

{% block title %}Edit Staff Member · MediTrack{% endblock %}

{% block content %}
<div class="page-container">
  <div class="page-header">
    <h1><i class="fas fa-user-edit"></i> Edit Staff Member</h1>
    <a href="/staff" class="btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
  </div>

  {% if error %}
  <div class="alert">
    <i class="fas fa-exclamation-circle"></i> {{ error }}
  </div>
  {% endif %}

  <div class="form-container">
    <form action="/staff/edit/{{ staff.id }}" method="POST">
      <div class="form-grid">
        <div class="form-group">
          <label>Staff Code</label>
          <input type="text" value="{{ staff.staff_code }}" disabled />
          <small>Staff code cannot be changed</small>
        </div>
        <div class="form-group">
          <label>Full Name <span class="required">*</span></label>
          <input type="text" name="name" value="{{ staff.name }}" required />
        </div>
        <div class="form-group">
          <label>Email <span class="required">*</span></label>
          <input type="email" name="email" value="{{ staff.email }}" required />
        </div>
        <div class="form-group">
          <label>Phone <span class="required">*</span></label>
          <input type="text" name="phone" value="{{ staff.phone }}" required />
        </div>
        <div class="form-group">
          <label>Department <span class="required">*</span></label>
          <select name="department" required>
            <option value="">Select Department</option>
            <option value="Cardiology" {% if staff.department == 'Cardiology' %}selected{% endif %}>Cardiology</option>
            <option value="Neurology" {% if staff.department == 'Neurology' %}selected{% endif %}>Neurology</option>
            <option value="Pediatrics" {% if staff.department == 'Pediatrics' %}selected{% endif %}>Pediatrics</option>
            <option value="Orthopedics" {% if staff.department == 'Orthopedics' %}selected{% endif %}>Orthopedics</option>
            <option value="General Medicine" {% if staff.department == 'General Medicine' %}selected{% endif %}>General Medicine</option>
            <option value="Surgery" {% if staff.department == 'Surgery' %}selected{% endif %}>Surgery</option>
            <option value="Radiology" {% if staff.department == 'Radiology' %}selected{% endif %}>Radiology</option>
            <option value="Laboratory" {% if staff.department == 'Laboratory' %}selected{% endif %}>Laboratory</option>
            <option value="Pharmacy" {% if staff.department == 'Pharmacy' %}selected{% endif %}>Pharmacy</option>
            <option value="Nursing" {% if staff.department == 'Nursing' %}selected{% endif %}>Nursing</option>
            <option value="Administration" {% if staff.department == 'Administration' %}selected{% endif %}>Administration</option>
            <option value="HR" {% if staff.department == 'HR' %}selected{% endif %}>HR</option>
          </select>
        </div>
        <div class="form-group">
          <label>Designation <span class="required">*</span></label>
          <input type="text" name="designation" value="{{ staff.designation }}" required />
        </div>
        <div class="form-group">
          <label>Works Under Doctor</label>
          <select name="doctor_id">
            <option value="">Select Doctor (Optional)</option>
            {% for doctor in doctors %}
            <option value="{{ doctor.id }}" {% if doctor.id == staff.doctor_id %}selected{% endif %}>
              {{ doctor.name }} ({{ doctor.specialization }})
            </option>
            {% endfor %}
          </select>
          <small>Select the doctor this staff member works under</small>
        </div>
        <div class="form-group">
          <label>Salary <span class="required">*</span></label>
          <input type="number" name="salary" value="{{ staff.salary }}" step="0.01" min="0" required />
        </div>
        <div class="form-group">
          <label>Joining Date <span class="required">*</span></label>
          <input type="date" name="joining_date" value="{{ staff.joining_date.strftime('%Y-%m-%d') if staff.joining_date else '' }}" required />
        </div>
        <div class="form-group full-width">
          <label>Address</label>
          <textarea name="address" rows="3">{{ staff.address or '' }}</textarea>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Update Staff</button>
        <a href="/staff" class="btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
