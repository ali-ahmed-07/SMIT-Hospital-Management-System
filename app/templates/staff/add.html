{% extends "base.html" %}

{% block title %}Add Staff Member · MediTrack{% endblock %}

{% block content %}
<div class="page-container">
  <div class="page-header">
    <h1><i class="fas fa-user-plus"></i> Add Staff Member</h1>
    <a href="/staff" class="btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
  </div>

  {% if error %}
  <div class="alert">
    <i class="fas fa-exclamation-circle"></i> {{ error }}
  </div>
  {% endif %}

  <div class="form-container">
    <form action="/staff/add" method="POST">
      <div class="form-grid">
        <div class="form-group">
          <label>Staff Code</label>
          <input type="text" value="{{ next_code }}" disabled />
          <small>Auto-generated</small>
        </div>
        <div class="form-group">
          <label>Full Name <span class="required">*</span></label>
          <input type="text" name="name" placeholder="Enter staff name" required />
        </div>
        <div class="form-group">
          <label>Email <span class="required">*</span></label>
          <input type="email" name="email" placeholder="staff@example.com" required />
        </div>
        <div class="form-group">
          <label>Phone <span class="required">*</span></label>
          <input type="text" name="phone" placeholder="+1 234 567 890" required />
        </div>
        <div class="form-group">
          <label>Department <span class="required">*</span></label>
          <select name="department" required>
            <option value="">Select Department</option>
            <option value="Cardiology">Cardiology</option>
            <option value="Neurology">Neurology</option>
            <option value="Pediatrics">Pediatrics</option>
            <option value="Orthopedics">Orthopedics</option>
            <option value="General Medicine">General Medicine</option>
            <option value="Surgery">Surgery</option>
            <option value="Radiology">Radiology</option>
            <option value="Laboratory">Laboratory</option>
            <option value="Pharmacy">Pharmacy</option>
            <option value="Nursing">Nursing</option>
            <option value="Administration">Administration</option>
            <option value="HR">HR</option>
          </select>
        </div>
        <div class="form-group">
          <label>Designation <span class="required">*</span></label>
          <input type="text" name="designation" placeholder="e.g., Registered Nurse" required />
        </div>
        <div class="form-group">
          <label>Works Under Doctor</label>
          <select name="doctor_id">
            <option value="">Select Doctor (Optional)</option>
            {% for doctor in doctors %}
            <option value="{{ doctor.id }}">{{ doctor.name }} ({{ doctor.specialization }})</option>
            {% endfor %}
          </select>
          <small>Select the doctor this staff member works under</small>
        </div>
        <div class="form-group">
          <label>Salary <span class="required">*</span></label>
          <input type="number" name="salary" placeholder="e.g., 50000" step="0.01" min="0" required />
        </div>
        <div class="form-group">
          <label>Joining Date <span class="required">*</span></label>
          <input type="date" name="joining_date" required />
        </div>
        <div class="form-group full-width">
          <label>Address</label>
          <textarea name="address" rows="3" placeholder="Enter staff address"></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Save Staff</button>
        <a href="/staff" class="btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
