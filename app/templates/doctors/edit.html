<!-- ==================== EDIT ==================== -->
{% extends "base.html" %}

{% block title %}Edit Doctor · MediTrack{% endblock %}

{% block content %}
<div class="page-container">
  <div class="page-header">
    <h1><i class="fas fa-user-edit"></i> Edit Doctor</h1>
    <a href="/doctors" class="btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
  </div>

  <div class="form-container">
    <form action="/doctors/edit/{{ doctor.id }}" method="POST">
      <div class="form-grid">
    <div class="form-group">
  <label>Doctor Code</label>
  <input type="text" value="{{ next_code }}" disabled />
  <small>Auto-generated</small>
</div>
        <div class="form-group">
          <label>Full Name <span class="required">*</span></label>
          <input type="text" name="name" value="{{ doctor.name }}" required />
        </div>
        <div class="form-group">
          <label>Specialization <span class="required">*</span></label>
          <input type="text" name="specialization" value="{{ doctor.specialization }}" required />
        </div>
        <div class="form-group">
          <label>Email <span class="required">*</span></label>
          <input type="email" name="email" value="{{ doctor.email }}" required />
        </div>
        <div class="form-group">
          <label>Phone <span class="required">*</span></label>
          <input type="text" name="phone" value="{{ doctor.phone }}" required />
        </div>
        <div class="form-group">
          <label>Salary <span class="required">*</span></label>
          <input type="number" name="salary" step="0.01" value="{{ doctor.salary }}" required />
        </div>
        <div class="form-group">
          <label>Gender <span class="required">*</span></label>
          <select name="gender" required>
            <option value="Male" {% if doctor.gender == 'Male' %}selected{% endif %}>Male</option>
            <option value="Female" {% if doctor.gender == 'Female' %}selected{% endif %}>Female</option>
            <option value="Other" {% if doctor.gender == 'Other' %}selected{% endif %}>Other</option>
          </select>
        </div>
        <div class="form-group full-width">
          <label>Address</label>
          <textarea name="address" rows="3">{{ doctor.address or '' }}</textarea>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Update Doctor</button>
        <a href="/doctors" class="btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
