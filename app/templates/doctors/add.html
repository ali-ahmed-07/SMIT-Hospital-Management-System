{% extends "base.html" %}

{% block title %}Add New Doctor · MediTrack{% endblock %}

{% block content %}
<div class="page-container">
  <div class="page-header">
    <h1><i class="fas fa-user-plus"></i> Add New Doctor</h1>
    <a href="/doctors" class="btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
  </div>

  {% if error %}
  <div class="alert">
    <i class="fas fa-exclamation-circle"></i> {{ error }}
  </div>
  {% endif %}

  <div class="form-container">
    <form action="/doctors/add" method="POST">
      <div class="form-grid">
       <div class="form-group">
  <label>Doctor Code</label>
  <input type="text" value="{{ next_code }}" disabled />
  <small>Auto-generated</small>
</div>
        <div class="form-group">
          <label>Full Name <span class="required">*</span></label>
          <input type="text" name="name" placeholder="Enter doctor name" required />
        </div>
        <div class="form-group">
          <label>Specialization <span class="required">*</span></label>
          <input type="text" name="specialization" placeholder="e.g., Cardiology" required />
        </div>
        <div class="form-group">
          <label>Email <span class="required">*</span></label>
          <input type="email" name="email" placeholder="doctor@hospital.com" required />
        </div>
        <div class="form-group">
          <label>Phone <span class="required">*</span></label>
          <input type="text" name="phone" placeholder="+1 234 567 890" required />
        </div>
        <div class="form-group">
          <label>Salary <span class="required">*</span></label>
          <input type="number" name="salary" step="0.01" placeholder="0.00" required />
        </div>
        <div class="form-group">
          <label>Gender <span class="required">*</span></label>
          <select name="gender" required>
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group full-width">
          <label>Address</label>
          <textarea name="address" rows="3" placeholder="Enter address"></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Save Doctor</button>
        <a href="/doctors" class="btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
